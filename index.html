<title>ChooseMyCard — Which card?</title>
<style>
  :root{
    --bg:#f4f5f7; --card:#ffffff; --ink:#1a1d21; --muted:#596270; --line:#e5e7eb;
    --accent:#2563eb; --primary-bg:#2563eb; --accent-ink:#ffffff; --gold:#b45309; --good:#047857; --warn:#b91c1c;
    --chip:#eef2ff; --chip-ink:#3730a3; --radius:16px; --nav-h:74px;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0f1115; --card:#191c22; --ink:#f3f4f6; --muted:#aeb6c2; --line:#2a2f38;
      --accent:#3b82f6; --primary-bg:#1d4ed8; --gold:#f59e0b; --good:#34d399; --warn:#f87171; --chip:#1e2a4a; --chip-ink:#a5b4fc; }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--ink); padding-bottom:calc(var(--nav-h) + 12px + env(safe-area-inset-bottom));}
  .brand{display:flex; align-items:center; gap:11px;
    padding:calc(env(safe-area-inset-top, 24px) + 30px) 18px 12px;
    background:linear-gradient(180deg, rgba(37,99,235,.10), transparent); }
  .brand .logo{width:42px; height:42px; flex:none; border-radius:11px;
    box-shadow:0 3px 10px rgba(37,99,235,.35)}
  .brand .bname{font-size:20px; font-weight:800; letter-spacing:-.02em; line-height:1.1}
  .brand .btag{font-size:12px; color:var(--muted); margin-top:1px}
  header{padding:6px 18px 8px; display:flex; align-items:baseline; gap:8px}
  header h1{font-size:22px; margin:0; letter-spacing:-.02em; white-space:nowrap}
  header h1:focus{outline:none}
  header .sub{color:var(--muted); font-size:13px}
  header .header-action{margin-left:auto; border:0; background:none; color:var(--accent); min-height:44px; padding:8px 0 8px 2px;
    font:inherit; font-size:13px; font-weight:700; cursor:pointer; white-space:nowrap}
  header .header-action[hidden]{display:none}
  main{padding:0 14px; max-width:560px; margin:0 auto}
  .panel{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin:10px 0}
  .catgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
  .catbtn{display:flex; flex-direction:column; align-items:center; gap:4px; padding:12px 4px;
    background:var(--card); border:1px solid var(--line); border-radius:14px; cursor:pointer; font-size:12.5px;
    color:var(--ink); font-weight:500}
  .catbtn .em{font-size:22px}
  .catbtn.active{border-color:var(--accent); background:var(--chip); color:var(--chip-ink)}
  .locbtn{width:100%; margin-top:8px; padding:12px; border-radius:14px; border:1px dashed var(--line);
    background:transparent; color:var(--muted); font-size:14px; cursor:pointer}
  .result-card{display:flex; align-items:center; gap:12px; padding:12px; border-radius:14px; border:1px solid var(--line); margin-top:8px}
  .result-card.winner{border:2px solid var(--accent); background:var(--chip)}
  .rank{font-size:20px; width:28px; text-align:center}
  .rc-body{flex:1; min-width:0}
  .rc-name{font-weight:650; font-size:15px}
  .rc-note{color:var(--muted); font-size:12.5px; margin-top:2px; line-height:1.35}
  .rc-rate{font-weight:700; font-size:16px; white-space:nowrap}
  .winner .rc-rate{color:var(--accent)}
  .badge{display:inline-block; font-size:11px; padding:2px 7px; border-radius:99px; background:var(--chip); color:var(--chip-ink); margin-left:6px; vertical-align:1px}
  .badge.warn{background:rgba(185,28,28,.12); color:var(--warn)}
  .badge.good{background:rgba(4,120,87,.12); color:var(--good)}
  .hint{color:var(--muted); font-size:13px; line-height:1.45}
  nav{position:fixed; bottom:0; left:0; right:0; display:flex; gap:2px; background:var(--card);
    border-top:1px solid var(--line); padding:7px 6px calc(7px + env(safe-area-inset-bottom));
    box-shadow:0 -6px 18px rgba(0,0,0,.08); z-index:40}
  nav.visual-viewport-anchor{top:0; bottom:auto; transform:translate3d(0,var(--nav-y,0px),0); will-change:transform}
  nav button{flex:1; background:none; border:none; color:var(--muted); font-size:10.5px; font-weight:600;
    cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px; padding:0; font-family:inherit; min-width:0; line-height:1.2; overflow-wrap:anywhere; text-align:center}
  nav button .em{font-size:19px; line-height:1; display:flex; align-items:center; justify-content:center;
    width:54px; height:30px; border-radius:99px; background:rgba(125,125,125,.10);
    border:1.5px solid transparent; transition:background .18s, transform .18s, border-color .18s, box-shadow .18s}
  nav button:not(.on) .em{filter:grayscale(1); opacity:.75}
  nav button:active .em{transform:scale(.9)}
  nav button.on{color:var(--accent)}
  nav button.on .em{background:var(--chip); border-color:var(--accent); box-shadow:0 1px 8px rgba(37,99,235,.28)}
  @keyframes tabpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
  nav button.pulse .em{animation:tabpulse .8s ease-in-out 5; background:var(--chip); border-color:var(--accent);
    box-shadow:0 1px 10px rgba(37,99,235,.4); filter:none; opacity:1}
  .row{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:none}
  .row .grow{flex:1; min-width:0}
  .row .title{font-weight:600; font-size:14.5px}
  .row .sub2{color:var(--muted); font-size:12.5px; margin-top:1px}
  .iconbtn{border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:10px;
    width:44px; height:44px; font-size:15px; cursor:pointer; flex:none}
  .iconbtn:disabled{opacity:.3}
  .pill{border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:99px;
    padding:8px 14px; min-height:44px; font-size:13.5px; cursor:pointer; font-weight:500}
  .pill.primary{background:var(--primary-bg); color:var(--accent-ink); border-color:var(--primary-bg)}
  h2{font-size:16px; margin:14px 4px 6px}
  h3{font-size:14px; margin:0 0 6px}
  .section-note{font-size:12px; color:var(--muted); margin:2px 4px 8px}
  label.check{display:flex; gap:10px; align-items:center; font-size:14px; padding:8px 0}
  input[type=checkbox]{width:18px; height:18px; accent-color:var(--accent)}
  input[type=text], input[type=number], textarea, select{width:100%; padding:9px 10px; border-radius:10px; border:1px solid var(--line);
    background:var(--bg); color:var(--ink); font-size:14px; font-family:inherit}
  .rate-grid{display:grid; grid-template-columns:1fr 84px; gap:6px 10px; align-items:center; font-size:13.5px}
  .modal{position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:flex-end; z-index:50}
  .modal.open{display:flex}
  .sheet{background:var(--card); width:100%; max-height:86vh; overflow:auto; border-radius:18px 18px 0 0; padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
  .sheet-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px}
  .field-label{display:block; font-size:13.5px; font-weight:600; line-height:1.35}
  .field-label .tag{display:block; font-weight:400}
  .sr-only{position:absolute!important; width:1px!important; height:1px!important; padding:0!important; margin:-1px!important; overflow:hidden!important; clip:rect(0,0,0,0)!important; white-space:nowrap!important; border:0!important}
  .empty{color:var(--muted); text-align:center; padding:22px 10px; font-size:14px; line-height:1.5}
  .toast{position:fixed; bottom:calc(var(--nav-h) + 10px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--bg); padding:7px 9px 7px 16px; border-radius:99px; font-size:13px; opacity:0;
    transition:opacity .2s ease-out; pointer-events:none; z-index:60; max-width:92%; text-align:center;
    display:flex; align-items:center; gap:10px; box-shadow:0 8px 24px rgba(0,0,0,.24)}
  .toast.visual-viewport-anchor{top:0; bottom:auto; transform:translate3d(-50%,var(--toast-y,0px),0); will-change:transform}
  .toast.show{opacity:.97; pointer-events:auto}
  .toast button{border:0; border-radius:99px; background:var(--bg); color:var(--ink); min-height:44px; padding:0 14px;
    font:inherit; font-weight:700; cursor:pointer}
  #toastmsg{min-width:0; overflow-wrap:anywhere}
  .tag{font-size:11px; color:var(--muted)}
  a{color:var(--accent)}
  button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{
    outline:3px solid var(--accent); outline-offset:2px}
  .row[tabindex]:focus-visible{outline:3px solid var(--accent); outline-offset:2px; border-radius:10px}
  .recurring-status:focus-visible,.confirmed-status:focus-visible,.recurring-head h2:focus-visible{
    outline:3px solid var(--accent); outline-offset:3px; border-radius:4px}
  .storage-warning{max-width:532px; margin:0 auto 10px; padding:10px 14px; border:1px solid var(--warn); border-radius:12px;
    color:var(--ink); background:color-mix(in srgb, var(--warn) 8%, var(--card)); font-size:13px; line-height:1.4}
  .storage-warning button{border:0; background:none; color:var(--accent); font:inherit; font-weight:700; min-height:44px; padding:7px 4px; cursor:pointer}
  .title-icon{display:inline-block; width:1.15em; margin-right:6px; text-align:center; font-size:1em; line-height:1; vertical-align:-.04em}
  .action-list{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); margin:8px 0}
  .action-row{display:block; padding:13px 14px; border-bottom:1px solid var(--line)}
  .action-row:last-child{border-bottom:0}
  .action-row.completed{background:color-mix(in srgb, var(--good) 4%, var(--card))}
  .action-topline{display:flex; align-items:flex-start; gap:12px; min-width:0}
  .action-topline .action-title{flex:1; min-width:0}
  .action-title{font-size:14.5px; font-weight:680; line-height:1.3}
  .action-meta{font-size:12.5px; color:var(--muted); line-height:1.4; margin-top:3px}
  .action-meta.urgent{color:var(--warn); font-weight:750}
  .issuer-action{display:inline-flex; align-items:flex-start; justify-content:flex-end; flex:none; min-height:44px; padding:1px 0 9px;
    color:var(--accent); font:inherit; font-size:12.5px; font-weight:650; line-height:1.3; text-align:right; text-decoration:underline;
    text-underline-offset:2px; white-space:nowrap}
  .action-footer{display:flex; justify-content:space-between; align-items:flex-end; gap:12px; margin-top:2px; min-width:0}
  .action-links{display:flex; gap:13px; align-items:center; flex:1; flex-wrap:wrap; margin-top:7px}
  .action-links a, .action-links button{display:inline-flex; align-items:center; border:0; background:none; padding:9px 0; min-height:44px;
    font:inherit; font-size:12.5px; font-weight:650; cursor:pointer}
  .action-links .manage-action{color:var(--muted); text-decoration:none; font-weight:600}
  .action-links .manage-action:hover{text-decoration:underline; text-underline-offset:2px}
  button.manage-action{border:0; background:none; color:var(--muted); min-height:44px; padding:8px 0; font:inherit; font-size:12.5px; font-weight:600; cursor:pointer; text-align:left}
  button.manage-action:hover{text-decoration:underline; text-underline-offset:2px}
  .task-checks{display:flex; flex:none; flex-direction:column; align-items:flex-end}
  .task-check{display:flex; align-items:center; gap:7px; max-width:138px; min-height:44px; font-size:12.5px; line-height:1.25;
    font-weight:650; cursor:pointer}
  .task-check input{flex:none; width:20px; height:20px}
  .back-btn{border:0; background:none; color:var(--accent); min-height:44px; padding:4px 4px; margin:0 0 4px;
    font:inherit; font-size:13.5px; font-weight:700; cursor:pointer}
  .quiet-state{padding:17px 14px; color:var(--muted); font-size:13.5px; line-height:1.45}
  .quiet-state a, .quiet-state button{font:inherit; font-weight:700; color:var(--accent)}
  .disclosure{margin:14px 0 0; border-top:1px solid var(--line); padding-top:8px}
  .disclosure > button{width:100%; display:flex; justify-content:space-between; align-items:center; border:0; background:none;
    color:var(--muted); font:inherit; font-size:12.5px; font-weight:700; padding:10px 4px; min-height:44px; cursor:pointer}
  .history-month{font-size:12px; color:var(--muted); font-weight:750; margin:13px 4px 5px; text-transform:uppercase; letter-spacing:.04em}
  .history-row{display:flex; justify-content:space-between; gap:12px; padding:9px 4px; border-bottom:1px solid var(--line); font-size:12.5px}
  .history-row:last-child{border-bottom:0}
  .history-row .when{color:var(--muted); white-space:nowrap}
  .progress-line{display:flex; align-items:center; justify-content:space-between; gap:12px; color:var(--muted); font-size:12.5px; margin:0 4px 7px}
  .progress-line strong{color:var(--ink)}
  .quarterly-nav{width:100%; display:flex; align-items:center; justify-content:space-between; gap:14px; margin:18px 0 8px;
    padding:13px 14px; border:1px solid var(--line); border-radius:var(--radius); background:var(--card); color:var(--ink);
    font:inherit; text-align:left; cursor:pointer}
  .quarterly-nav-copy{display:flex; align-items:center; gap:10px; min-width:0}
  .quarterly-nav-copy strong{display:block; font-size:14.5px; line-height:1.3}
  .quarterly-nav-copy span{display:block; color:var(--muted); font-size:12.5px; line-height:1.4; margin-top:2px}
  .quarterly-nav-action{flex:none; color:var(--accent); font-size:12.5px; font-weight:700; text-align:right}
  .radar-toolbar{display:flex; align-items:center; justify-content:space-between; gap:12px; margin:4px 4px 10px}
  .quarterly-filter{display:inline-flex; align-items:center; gap:8px; min-height:44px; padding:6px 2px;
    color:var(--ink); font-size:12.5px; font-weight:700; cursor:pointer}
  .quarterly-filter input{width:20px; height:20px; margin:0; flex:none; accent-color:var(--accent); cursor:pointer}
  .reminder-row{display:flex; align-items:center; justify-content:space-between; gap:14px; padding:12px 0 2px}
  .reminder-row .hint{margin:0}
  .not-shown-list{border:1px solid var(--line); border-radius:12px; padding:0 12px; background:var(--card)}
  .recurring-section{margin:20px 4px 4px}
  .recurring-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px}
  .recurring-head h2{margin:0}
  .section-action{border:0; background:none; color:var(--accent); min-height:44px; padding:8px 0; font:inherit;
    font-size:12.5px; font-weight:700; cursor:pointer; text-align:right}
  .recurring-list{border-top:1px solid var(--line); margin-top:7px}
  .recurring-row{padding:12px 0; border-bottom:1px solid var(--line)}
  .recurring-row h3{font-size:14.5px; line-height:1.3; margin:0}
  .recurring-status{font-size:12.5px; color:var(--muted); line-height:1.4; margin-top:3px}
  .recurring-status.needs-review{color:var(--warn); font-weight:750}
  .recurring-manage{display:flex; justify-content:space-between; align-items:flex-end; gap:12px; margin-top:4px}
  .recurring-setup{display:grid; grid-template-columns:minmax(0,1fr) max-content; align-items:center; gap:10px 12px;
    margin:10px -14px 0; padding:10px 14px; border-top:1px solid var(--line); background:color-mix(in srgb, var(--accent) 4%, transparent)}
  .recurring-setup-copy strong{display:block; font-size:13px; line-height:1.35}
  .recurring-setup-copy span{display:block; color:var(--muted); font-size:12px; line-height:1.4; margin-top:2px}
  .recurring-discovery-title{font-size:13.5px; font-weight:750; line-height:1.35}
  .review-note,.review-fallback{font-size:12.5px; line-height:1.45; margin:5px 0 0; color:var(--muted)}
  .review-fallback{color:var(--ink); font-weight:650}
  .choice-row{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px}
  .choice-row .pill{font-size:12.5px}
  .recurring-count{font-size:12px; color:var(--warn); font-weight:750}
  .review-confirm{white-space:nowrap}
  .confirmed-status{display:inline-flex; align-items:center; min-height:44px; color:var(--good); font-size:12.5px; font-weight:750}
  .hide-radar-footer{display:grid; grid-template-columns:max-content minmax(0,1fr); align-items:center; gap:10px 12px;
    margin:10px -14px -13px; padding:10px 14px; border-top:1px solid var(--line);
    background:color-mix(in srgb, var(--muted) 4%, transparent)}
  .hide-radar-action{display:inline-flex; align-items:center; justify-content:center; min-height:44px; border:1px solid var(--line);
    border-radius:12px; background:transparent; color:var(--muted); padding:8px 12px; font:inherit; font-size:12.5px; font-weight:650; cursor:pointer}
  .hide-radar-footer p{max-width:60ch; font-size:12px; line-height:1.45; color:var(--muted); margin:0}
  .terms-changed{color:var(--warn); font-weight:750}
  @media (max-width:420px){
    header{flex-wrap:wrap; align-items:flex-start}
    header h1{white-space:normal; max-width:100%; overflow-wrap:anywhere}
    header .sub{min-width:0; overflow-wrap:anywhere}
    .brand .bname{overflow-wrap:anywhere}
    .action-topline{gap:8px; flex-wrap:wrap}
    .action-topline .issuer-action{font-size:12px; white-space:normal; max-width:100%; overflow-wrap:anywhere}
    .action-footer{flex-wrap:wrap}
    .task-check{max-width:none; width:max-content}
    .action-links{margin-top:3px}
    .reminder-row{align-items:flex-start; flex-direction:column}
    .recurring-head{align-items:flex-start}
    .recurring-manage{align-items:flex-start; flex-direction:column}
    .radar-toolbar{align-items:flex-start; flex-direction:column}
    .quarterly-filter{align-self:flex-start}
    .quarterly-nav{align-items:flex-start; flex-wrap:wrap}
    .quarterly-nav-action{white-space:normal}
    .progress-line,.history-row{align-items:flex-start; flex-wrap:wrap}
    .history-row .when{white-space:normal}
    .choice-row{flex-direction:column}

    reviewBefore=recurringReviewSession?{keys:[...recurringReviewSession.keys],confirmed:[...recurringReviewSession.confirmed]}:null;
  mutator(); saveState(S,mutationNow); render(); restoreFocus(focusId);
  toast(message,9000,()=>{
    S=before;
    if(snapshotToken===promosVisitToken){
      recurringReviewSession=reviewBefore?{keys:[...reviewBefore.keys],confirmed:new Set(reviewBefore.confirmed)}:null;
    }
    saveState(S); render(); restoreFocus(undoFocusId); toast('Change undone');
  });
}
function restoreFocus(focusId){
  requestAnimationFrame(()=>{
    const exact=focusId&&(document.querySelector(`[data-focus-id="${focusId}"]`)||document.getElementById(focusId));
    const viewAll=document.getElementById('radar-view-all');
    const target=exact||viewAll&&!viewAll.hidden&&viewAll||document.getElementById('hdr')||document.querySelector('main button, main a');
    if(!target) return;
    target.focus({preventScroll:true});
    const rect=target.getBoundingClientRect();
    if(rect.top<12||rect.bottom>window.innerHeight-12) target.scrollIntoView({block:'center'});
    keepFocusedControlVisible();
  });
}
function focusPageHeading(){ requestAnimationFrame(()=>document.getElementById('hdr')?.focus()); }
function captureRefreshFocus(now){
  const active=document.activeElement; if(!active||!mainEl.contains(active)) return null;
  if(active.dataset.taskCheck) return {type:'focusId',value:currentFocusForTaskKey(active.dataset.taskCheck,now)};
  if(active.dataset.focusId) return {type:'focusId',value:active.dataset.focusId};
  for(const attribute of ['data-skip-task','data-hide-task','data-unskip-task','data-restore-task','data-show-task']){
    if(active.hasAttribute(attribute)){
      const focusId=currentFocusForTaskKey(active.getAttribute(attribute),now);
      return {type:'taskAction',attribute,taskKey:focusId.replace(/^task-/,''),focusId};
    }
  }
  for(const attribute of ['data-show-radar','data-benefit-enroll','data-benefit-use','data-bcat','data-review-confirm','data-remove-recurring']){
    if(active.hasAttribute(attribute)) return {type:'attribute',attribute,value:active.getAttribute(attribute)};
  }
  if(active.id) return {type:'id',value:active.id};
  if(active.getAttribute('aria-label')) return {type:'aria',value:active.getAttribute('aria-label')};
  return null;
}
function restoreRefreshFocus(target){
  if(!target) return;
  requestAnimationFrame(()=>{
    let element=null;
    if(target.type==='focusId') element=[...document.querySelectorAll('[data-focus-id]')].find(item=>item.dataset.focusId===target.value);
    else if(target.type==='taskAction'){
      element=[...document.querySelectorAll(`[${target.attribute}]`)].find(item=>item.getAttribute(target.attribute)===target.taskKey);
      if(!element) element=[...document.querySelectorAll('[data-focus-id]')].find(item=>item.dataset.focusId===target.focusId);
      if(!element) for(const attribute of ['data-skip-task','data-hide-task','data-unskip-task','data-restore-task','data-show-task']){
        element=[...document.querySelectorAll(`[${attribute}]`)].find(item=>item.getAttribute(attribute)===target.taskKey); if(element) break;
      }
      if(!element) element=document.getElementById('not-shown-toggle');
    }
    else if(target.type==='attribute') element=[...document.querySelectorAll(`[${target.attribute}]`)].find(item=>item.getAttribute(target.attribute)===target.value);
    else if(target.type==='id') element=document.getElementById(target.value);
    else if(target.type==='aria') element=[...document.querySelectorAll('[aria-label]')].find(item=>item.getAttribute('aria-label')===target.value);
    if(!element) element=document.getElementById('promos-back')||document.getElementById('radar-view-all')||mainEl.querySelector('button, a, input');
    element?.focus({preventScroll:true});
  });
}

/* ---------- Radar task engine ---------- */
function benefitById(cardId,benefitId){ return (BENEFITS[cardId]||[]).find(b=>b.id===benefitId); }
function quarterlyActionForCard(cardId){ return QUARTERLY_ACTIONS.find(a=>a.cardId===cardId); }
function localDateFromIsoDate(value){
  const m=String(value||'').match(/^(\d{4})-(\d{2})-(\d{2})$/); if(!m) return null;
  const d=new Date(+m[1],+m[2]-1,+m[3]); return d.getFullYear()===+m[1]&&d.getMonth()===+m[2]-1&&d.getDate()===+m[3]?d:null;
}
function localIsoDate(date){ return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`; }
function periodLastDate(end){ const d=new Date(end); d.setDate(d.getDate()-1); return d; }
function displayDate(value){
  if(!value) return ''; const d=value instanceof Date?value:new Date(value); if(isNaN(d)) return '';
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
}
function displayCalendarDate(value,now=new Date()){
  const d=value instanceof Date?value:localDateFromIsoDate(value); if(!d||isNaN(d)) return '';
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric',...(d.getFullYear()!==now.getFullYear()?{year:'numeric'}:{})});
}
function completionFor(kind,cardId,itemId,periodKey,state=S){ return state.completions[canonicalTaskKey(kind,cardId,itemId,periodKey)]||null; }
function enrollmentFor(cardId,benefitId,state=S){ return state.enrollments[canonicalEnrollmentKey(cardId,benefitId)]||null; }
function recurringSetupFor(cardId,benefitId,state=S){ return state.recurringSetups[canonicalRecurringKey(cardId,benefitId)]||null; }
function recurringDates(record){
  const confirmed=record&&localDateFromIsoDate(record.confirmedOn); if(!confirmed) return null;
  const reviewDue=addCalendarMonths(confirmed,6), graceEnd=addCalendarDays(reviewDue,30);
  return {reviewDue,graceEnd};
}
function recurringSetupStatus(cardId,benefitId,state=S,now=new Date()){
  const key=canonicalRecurringKey(cardId,benefitId), meta=RADAR_BENEFIT_MAP[key], record=state.recurringSetups[key]||null;
  if(!meta?.recurringEligible) return {status:'ineligible',key,meta,record:null};
  if(!record) return {status:'none',key,meta,record:null};
  const dates=recurringDates(record), base={key,meta,record,...dates};
  if(!state.myCards.includes(cardId)) return {...base,status:'suspended'};
  if(record.suspendedAt) return {...base,status:'suspended'};
  if(record.termsVersion!==meta.recurringTermsVersion) return {...base,status:'terms-changed'};
  if(meta.requiresEnrollment&&!enrollmentFor(cardId,benefitId,state)) return {...base,status:'suspended'};
  if(state.radarHidden[canonicalHiddenKey(cardId,benefitId)]) return {...base,status:'suspended'};
  const today=localDay(now);
  if(today>=dates.graceEnd) return {...base,status:'expired'};
  if(today>=dates.reviewDue) return {...base,status:'review-due'};
  return {...base,status:'active'};
}
function recurringSetupsForState(state=S,now=new Date()){
  return Object.values(state.recurringSetups).map(record=>{
    const card=getCardFor(record.cardId,state), benefit=benefitById(record.cardId,record.benefitId), status=recurringSetupStatus(record.cardId,record.benefitId,state,now);
    return {...status,card,benefit};
  }).filter(item=>item.meta?.recurringEligible&&item.card&&item.benefit);
}
function suspendRecurringSetup(cardId,benefitId,reason,mutationNow=new Date()){
  const key=canonicalRecurringKey(cardId,benefitId), record=S.recurringSetups[key];
  if(record&&RECURRING_SUSPENSION_REASONS.has(reason)){ record.suspendedAt=mutationNow.toISOString(); record.suspensionReason=reason; }
}
function benefitAmount(meta,now){ return meta.decemberAmount&&now.getMonth()===11?meta.decemberAmount:meta.amount; }
function benefitDetail(meta,benefit,now){

}
function completedLabel(task){

  return task.completedAt?`${verb} ${displayDate(task.completedAt)}`:verb;

function taskRetentionVisible(task,now){

function buildBenefitTasks(now=new Date(),state=S){

function compareRadarTasks(a,b,state=S){
  const aHardDeadline=!a.done&&a.actionEnd&&a.actionEnd<a.end&&a.daysLeft<=7, bHardDeadline=!b.done&&b.actionEnd&&b.actionEnd<b.end&&b.daysLeft<=7;
  return Number(a.done)-Number(b.done)||Number(!!b.nonRetroactive)-Number(!!a.nonRetroactive)||Number(bHardDeadline)-Number(aHardDeadline)||a.daysLeft-b.daysLeft||
    state.myCards.indexOf(a.card.id)-state.myCards.indexOf(b.card.id)||a.title.localeCompare(b.title)||a.key.localeCompare(b.key);
}
function buildRadarTasks(now=new Date(),state=S){
  const all=[...buildQuarterlyTasks(now,state),...buildBenefitTasks(now,state)].sort((a,b)=>compareRadarTasks(a,b,state));
  const suppressed=all.filter(t=>(t.hidden||t.skipped)&&!t.closed&&!t.unavailable);
  const recurring=all.filter(t=>t.recurringSuppressed&&!t.hidden&&!t.skipped&&!t.closed&&!t.unavailable);
  const active=all.filter(t=>!t.recurringSuppressed&&!t.hidden&&!t.skipped&&!t.closed&&!t.unavailable&&taskRetentionVisible(t,now));
  return {all,active,suppressed,recurring,unresolved:active.filter(t=>!t.done||t.recurring?.status==='terms-changed')};
}

function completionHistory(now=new Date()){

    if(!recordWithinHistory(r,now)) continue;
    const action=QUARTERLY_ACTIONS.find(a=>a.id===r.itemId), benefit=benefitById(r.cardId,r.itemId), card=getCard(r.cardId);
    const verb=r.actionType==='activate'?'Activated':r.actionType==='select'?'Selected':'Used';
    const attested=r.attestedBy?`${verb} by ${displayDate(localDateFromIsoDate(r.attestedBy))}`:verb;
    events.push({at:r.completedAt,sortAt:r.completedAt||periodEndFromKey(r.periodKey),label:`${attested}: ${action?action.name:benefit?benefit.name:r.labelSnapshot}`,
      cardName:card?card.name:r.cardNameSnapshot,undated:!r.completedAt,recorded:!!r.attestedBy});
  }
  for(const r of Object.values(S.enrollments)){
    const d=new Date(r.enrolledAt); if(localDay(d)<cutoff) continue;
    const benefit=benefitById(r.cardId,r.benefitId), card=getCard(r.cardId), meta=RADAR_BENEFIT_MAP[r.cardId+':'+r.benefitId];
    events.push({at:r.enrolledAt,sortAt:d,label:`${meta&&meta.prerequisiteDoneLabel||'Enrolled'}: ${benefit?benefit.name:r.labelSnapshot}`,cardName:card?card.name:r.cardNameSnapshot});
  }
  return events.sort((a,b)=>new Date(b.sortAt)-new Date(a.sortAt)||a.label.localeCompare(b.label));
}

/* Effective % return for card on category. */
function evaluateForState(card,catId,state,now=new Date()){
  const rates=cardRatesFor(card,state);
  let r = rates[catId];
  let viaRotating=false, needsActivation=false, activationClosed=false, rotLabel='';
  if(card.rotating){
    const period=periodInfo('quarter',now), rot=(ROTATING[period.key]||{})[card.id];
    if(rot && rot.cats.includes(catId)){
      const rotRate = {v:5,u:'%',cap:'$1,500/qtr cap'};
      const base = r || rates.other;
      const effBase = base ? base.v * (base.u==='x'?cppFor(card,state):1) : 0;
      if(5 >= effBase){
        const action=quarterlyActionForCard(card.id), completed=action&&completionFor('activate',card.id,action.id,period.key,state);
        const closed=!!(action&&action.affectsRanking&&!completed&&localDay(now)>=actionEndFor(action,period));
        if(closed){ activationClosed=true; rotLabel='activation closed; base rate shown'; }
        else{
          r=rotRate; viaRotating=true;
          needsActivation=!action||(action.affectsRanking&&!completed);
          rotLabel='rotating 5% this quarter';
        }
      }
    }
  }
  if(!r) r = rates.other;
  if(!r) return null;
  const eff = r.v * (r.u==='x' ? cppFor(card,state) : 1);
  const disp = r.u==='x' ? r.v+'x pts' : r.v+'%';
  const note = [r.note, r.cap, rotLabel].filter(Boolean).join(' · ');
  return {eff, disp, note, viaRotating, needsActivation, activationClosed, unit:r.u, raw:r.v};
}
function evaluate(card,catId){ return evaluateForState(card,catId,S,new Date()); }
function rankCardsForState(state,catId,now=new Date()){
  const held=state.myCards.map(id=>getCardFor(id,state)).filter(Boolean);
  const rows=held.map((card,i)=>{const evaluated=evaluateForState(card,catId,state,now);return evaluated?{card,...evaluated,prio:i}:null;}).filter(Boolean);
  rows.sort((a,b)=>b.eff-a.eff||Number(a.needsActivation)-Number(b.needsActivation)||a.prio-b.prio);
  return rows;
}
function rankFor(catId){
  return rankCardsForState(S,catId,new Date());
}

  if(state?.promosView==='radar') return {view:'radar',filter:['all','quarterly'].includes(state.radarFilter)?state.radarFilter:'all'};
  return {view:'overview',filter:'all'};
}

function guessFromLocation(){
  const lb=document.getElementById('locbtn'); lb.textContent='📍 Locating…';
  if(!navigator.geolocation){ toast('Geolocation not available'); restoreFocus('location-guess'); return; }
  navigator.geolocation.getCurrentPosition(async pos=>{
    try{
      lb.textContent='📍 Looking up merchant…';
      const {latitude:lat, longitude:lon} = pos.coords;
      const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&zoom=18`, {headers:{'Accept':'application/json'}});
      const j = await res.json();
      const t = (j.type||'')+' '+(j.category||'')+' '+((j.name||''));
      const map = [
        [/restaurant|cafe|fast_food|bar|pub|food_court|ice_cream/i,'dining'],
        [/fuel|charging_station/i,'gas'],
        [/supermarket|grocery|greengrocer|convenience/i,'groceries'],
        [/pharmacy|chemist|drugstore/i,'drugstores'],
        [/cinema|theatre|stadium|nightclub|attraction|theme_park|zoo|museum/i,'entertain'],
        [/hotel|motel|hostel|guest_house/i,'hotels'],
        [/airport|aerodrome/i,'flights'],
        [/station|bus_stop|subway|tram|platform/i,'transit'],
        [/post_office|courier|parcel/i,'shipping'],
      ];
      const hit = map.find(([re])=>re.test(t));
      if(hit){ selectedCat = hit[1]; toast(`Looks like: ${j.name||j.type||'a '+hit[1]+' spot'}`); }
      else toast(`Couldn't classify "${j.name||j.type||'this spot'}" — pick manually`);
      render(); restoreFocus(hit?`category-${hit[1]}`:'location-guess');
    }catch(e){ toast('Lookup failed — pick a category manually'); render(); restoreFocus('location-guess'); }
  }, ()=>{ toast('Location permission denied'); render(); restoreFocus('location-guess'); }, {enableHighAccuracy:true, timeout:8000});
}

function taskStatusLines(task){
  const recurringTermsChanged=task.recurring?.status==='terms-changed';
  if(task.done&&!recurringTermsChanged) return [];
  const lines=[];
  if(recurringTermsChanged) lines.push({text:'Benefit terms changed. Review this recurring charge.',urgent:true});
  if(task.done) return lines;
  if(task.nonRetroactive) lines.push({text:'Not retroactive',urgent:true});
  if(task.closed) lines.push({text:`Deadline passed: ${displayDate(periodLastDate(task.actionEnd))}`,urgent:true});
  else if(task.unavailable) lines.push({text:'Current categories unavailable. Check the issuer before activating.',urgent:true});
  else if((task.actionType==='activate'||task.actionType==='select')&&task.actionEnd<task.end){
    const verb=task.actionType==='select'?'Choose':'Activate', date=displayDate(periodLastDate(task.actionEnd));
    const due=task.daysLeft===0?`Due today: ${verb.toLowerCase()} by ${date}`:`Due in ${task.daysLeft} day${task.daysLeft===1?'':'s'}: ${verb.toLowerCase()} by ${date}`;
    lines.push({text:task.daysLeft<=7?due:`${verb} by ${date}`,urgent:task.daysLeft<=7});
  }else if(task.actionType==='enroll'){
    lines.push({text:`${task.prerequisiteLabel}, then use by ${displayDate(periodLastDate(task.end))}`,urgent:task.daysLeft<=7});
  }else if(task.actionType==='use') lines.push({text:task.daysLeft===0?'Expires today':`Expires in ${task.daysLeft} days`,urgent:task.daysLeft<=7});
  return lines;
}
function skipPeriodLabel(task){
  const key=String(task.periodKey||'');
  let match=key.match(/^\d{4}-(\d{2})$/); if(match) return `Skip ${new Date(2000,+match[1]-1,1).toLocaleDateString(undefined,{month:'long'})}`;
  match=key.match(/^\d{4}-Q([1-4])$/); if(match) return `Skip Q${match[1]}`;
  match=key.match(/^\d{4}-H([12])$/); if(match) return match[1]==='1'?'Skip Jan–Jun':'Skip Jul–Dec';
  match=key.match(/^(\d{4})-Y$/); if(match) return `Skip ${match[1]}`;
  return 'Skip this benefit period';
}

    if(recurringReviewSession){ recurringReviewSession.keys=recurringReviewSession.keys.filter(item=>item!==key); recurringReviewSession.confirmed.delete(key); }
  },focusId,undoFocusId,mutationNow);
}
function bindPromoActions(){
  const viewAll=document.getElementById('radar-view-all'); if(viewAll) viewAll.onclick=()=>openPromosSubview('all');
  document.getElementById('quarterly-view-all')?.addEventListener('click',()=>openPromosSubview('quarterly'));
  document.getElementById('promos-back')?.addEventListener('click',backFromPromos);
  document.getElementById('ics')?.addEventListener('click',downloadICS);
  document.getElementById('quarterly-filter')?.addEventListener('change',event=>{
    RADAR_FILTER=event.currentTarget.checked?'quarterly':'all'; history.replaceState({promosView:'radar',radarFilter:RADAR_FILTER},'',location.pathname+location.search); render(); restoreFocus('quarterly-filter');
    const count=RADAR_FILTER==='quarterly'?buildQuarterlyTasks(new Date()).length:buildRadarTasks(new Date()).active.length;
    const message=RADAR_FILTER==='quarterly'?`Showing ${count} quarterly categor${count===1?'y':'ies'}.`:'Showing all Benefit Radar items.';

  mainEl.querySelectorAll('[data-go-cards]').forEach(b=>b.onclick=()=>{endPromosVisit();TAB='cards';PROMOS_VIEW='overview';RADAR_FILTER='all';render();restoreFocus('add-card-heading');});
  mainEl.querySelectorAll('[data-task-check]').forEach(cb=>cb.onchange=()=>{
    const mutationNow=new Date(), task=findCurrentTaskOrRefresh(cb.dataset.taskCheck,mutationNow); if(!task) return;
    const currentState=task.closed?'closed':task.unavailable?'unavailable':'open';
    if(cb.dataset.taskState!==currentState){ refreshForDeadlineChange(`task-${task.key}`); return; }
    setTaskChecked(task,cb.checked,cb.dataset.focusId,mutationNow);
  });
  mainEl.querySelectorAll('[data-skip-task]').forEach(b=>b.onclick=()=>{const mutationNow=new Date(),task=findCurrentTaskOrRefresh(b.dataset.skipTask,mutationNow);if(task)skipTask(task,mutationNow);});
  mainEl.querySelectorAll('[data-hide-task]').forEach(b=>b.onclick=()=>{const mutationNow=new Date(),task=findCurrentTaskOrRefresh(b.dataset.hideTask,mutationNow);if(task)hideBenefitTask(task);});
  mainEl.querySelectorAll('[data-unskip-task]').forEach(b=>b.onclick=()=>{const mutationNow=new Date(),task=findCurrentTaskOrRefresh(b.dataset.unskipTask,mutationNow);if(task)unskipTask(task);});
  mainEl.querySelectorAll('[data-restore-task]').forEach(b=>b.onclick=()=>{const mutationNow=new Date(),task=findCurrentTaskOrRefresh(b.dataset.restoreTask,mutationNow);if(task)restoreBenefit(task.card.id,task.benefitId,`task-${task.key}`,'not-shown-toggle');});
  mainEl.querySelectorAll('[data-show-task]').forEach(b=>b.onclick=()=>{const mutationNow=new Date(),task=findCurrentTaskOrRefresh(b.dataset.showTask,mutationNow);if(task)showTaskInRadar(task);});
  mainEl.querySelectorAll('[data-confirm-recurring]').forEach(button=>button.onclick=()=>{
    const [cardId,benefitId]=button.dataset.confirmRecurring.split(':'); confirmRecurringSetup(cardId,benefitId,{},new Date());
  });
  mainEl.querySelectorAll('[data-review-confirm]').forEach(button=>button.onclick=()=>{
    const record=S.recurringSetups[button.dataset.reviewConfirm]; if(record) confirmRecurringSetup(record.cardId,record.benefitId,{review:true},new Date());
  });
  mainEl.querySelectorAll('[data-remove-recurring]').forEach(button=>button.onclick=()=>removeRecurringSetup(button.dataset.removeRecurring,button.dataset.removeContext||'quiet',new Date()));
  document.getElementById('not-shown-toggle')?.addEventListener('click',()=>{notShownOpen=!notShownOpen;render();restoreFocus('not-shown-toggle');});
  document.getElementById('history-toggle')?.addEventListener('click',()=>{radarHistoryOpen=!radarHistoryOpen;render();restoreFocus('history-toggle');});
  document.getElementById('history-more')?.addEventListener('click',()=>{historyLimit+=20;render();restoreFocus(document.getElementById('history-more')?'history-more':'history-toggle');});
}
function renderPromos(){
  if(PROMOS_VIEW==='radar') renderFullRadar(); else renderPromosOverview();
  bindPromoActions();
}
function openPromosSubview(filter='all'){
  if(PROMOS_VIEW==='radar'&&RADAR_FILTER===filter) return; PROMOS_VIEW='radar'; RADAR_FILTER=filter; TAB='promos'; beginRadarVisit(new Date());
  history.pushState({promosView:'radar',radarFilter:filter},'',location.pathname+location.search); render(); window.scrollTo({top:0,behavior:'auto'});
  requestAnimationFrame(()=>document.getElementById('hdr').focus?.());
}
function backFromPromos(){
  if(PROMOS_VIEW==='overview') return; history.back();
}
function icsEscape(s){ return String(s).replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;'); }
function nextOccurrence(month,now){ const today=localDay(now); let d=new Date(today.getFullYear(),month-1,1); if(d<today)d=new Date(today.getFullYear()+1,month-1,1); return d; }
function icsDate(d){ return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`; }
function icsStamp(d){ return d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,''); }
function buildICS(now=new Date()){
  const summary='Check quarterly card categories', description='Review category activations and selections in ChooseMyCard.';
  const mk=(month,index)=>['BEGIN:VEVENT',`UID:choosemycard-quarter-${index}@local`,`DTSTAMP:${icsStamp(now)}`,
    `DTSTART;VALUE=DATE:${icsDate(nextOccurrence(month,now))}`,'RRULE:FREQ=YEARLY',`SUMMARY:${icsEscape(summary)}`,
    `DESCRIPTION:${icsEscape(description)}`,'BEGIN:VALARM','TRIGGER:PT9H','ACTION:DISPLAY',`DESCRIPTION:${icsEscape(summary)}`,'END:VALARM','END:VEVENT'].join('\r\n');
  return ['BEGIN:VCALENDAR','VERSION:2.0','CALSCALE:GREGORIAN','PRODID:-//ChooseMyCard//Quarterly reminders//EN',mk(1,'q1'),mk(4,'q2'),mk(7,'q3'),mk(10,'q4'),'END:VCALENDAR'].join('\r\n');
}
function downloadICS(){
  const blob=new Blob([buildICS()],{type:'text/calendar;charset=utf-8'}), url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url; a.download='choosemycard-quarterly-reminders.ics'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),0);
}
window.CardRouterRadar.buildICS=buildICS;

function renderSettings(){
  let html = `<h2>Point valuations</h2><p class="section-note">Cents per point, used to compare points cards against cash back fairly.</p><div class="panel"><div class="rate-grid">` +
    Object.entries(PROGRAMS).filter(([k])=>k!=='cash').map(([k,p])=>{
      const v = S.cpp[k]!=null?S.cpp[k]:p.cpp;
      return `<label class="field-label" for="cpp-${k}">${esc(p.name)} cents per point</label><input id="cpp-${k}" type="text" inputmode="decimal" data-cpp="${k}" value="${v}">`;
    }).join('') + `</div></div>
    <h2>Backup / transfer</h2><div class="panel">
      <p class="hint">Copy a setup link containing your cards, settings, benefit enrollments, recurring charge confirmations, items hidden from Benefit Radar, skipped periods, and current checkmarks. Anyone with the link can read and import this information. Imported recurring charge confirmations will not hide monthly reminders until confirmed again in Benefit Radar on the receiving device. Completion history is not included.</p>
      <div style="display:flex; gap:8px; margin-top:8px; flex-wrap:wrap">
        <button class="pill primary" id="copycfg">🔗 Copy setup link</button>
        <button class="pill" id="reset">Reset app</button></div></div>
    <h2>About the rules data</h2><div class="panel"><p class="hint">
      Earn rates were checked July 2026. Tracked benefit terms were checked August 2026. Issuers change rules constantly. Tap ✎ to update a card's rates when they change. Future rotating categories require an app update.</p></div>`;
  mainEl.innerHTML = html;
  mainEl.querySelectorAll('[data-cpp]').forEach(inp=>inp.onchange=()=>{
    const v=parseFloat(inp.value); if(!isNaN(v)&&v>0){ S.cpp[inp.dataset.cpp]=v; saveState(S); toast('Point valuation saved'); } });
  document.getElementById('copycfg').onclick=()=>copySetupLink();
  document.getElementById('reset').onclick=()=>{
    if(confirm('Erase all cards, settings, benefit enrollments, recurring charge confirmations, checkmarks, items hidden or skipped in Benefit Radar, and completion history from this device?')){
      S=structuredClone(DEFAULT_STATE); saveState(S); render(); focusPageHeading(); toast('App reset');
    }
  };
}

function currentPeriodForRecord(record,now){
  return record.periodKey===currentPeriodForTask(record.actionType,record.cardId,record.itemId,now);
}
function exportSetupState(now=new Date()){
  const stripSnapshots=r=>{const {labelSnapshot,cardNameSnapshot,...rest}=r;return rest;};
  const recurringSetups=Object.values(S.recurringSetups).filter(r=>S.myCards.includes(r.cardId)&&RADAR_BENEFIT_MAP[r.cardId+':'+r.benefitId]?.recurringEligible).map(r=>({...r}));
  return {schemaVersion:CURRENT_SCHEMA_VERSION,catalogVersion:RADAR_CATALOG_VERSION,myCards:[...S.myCards],overrides:structuredClone(S.overrides),cpp:structuredClone(S.cpp),
    custom:structuredClone(S.custom),coachDone:!!S.coachDone,enrollments:Object.values(S.enrollments).map(stripSnapshots),
    completions:Object.values(S.completions).filter(r=>currentPeriodForRecord(r,now)).map(stripSnapshots),
    radarHidden:Object.values(S.radarHidden).map(r=>({...r})),radarSkips:Object.values(S.radarSkips).filter(r=>new Date(r.expiresAt)>now&&r.periodKey===currentPeriodForTask(r.taskKind,r.cardId,r.itemId,now)).map(r=>({...r})),recurringSetups};
}
function setupUrl(){
  return location.href.split('#')[0]+'#'+encodeSetupState(exportSetupState());
}
async function copySetupLink(skipConfirmation=false){
  if(!skipConfirmation&&!confirm('Create a setup link containing your cards, settings, benefit enrollments, recurring charge confirmations, items hidden from Benefit Radar, skipped periods, and current checkmarks? Anyone with the link can read and import this information. Imported recurring charge confirmations will not hide monthly reminders until confirmed again in Benefit Radar on the receiving device.')) return;
  let url; try{url=setupUrl();}catch(e){toast(e instanceof SetupLinkError?e.message:'This setup link could not be created.',5000);return;}
  try{ await navigator.clipboard.writeText(url); toast('Setup link copied'); }
  catch(e){ prompt('Copy this setup link:',url); }
}
Object.assign(window.CardRouterRadar,{validateImportPayload,encodeSetupPayload,encodeSetupState,decodeSetupPayload,validEventIso,validIsoDate,confirmationDateMatchesInstant,periodMatchesCadence,taskStatusLines,completionRecordForTask,exportSetupState});

/* ---------- modal & nav ---------- */
let modalReturnFocus=null;
function setModalBackgroundInert(inert){
  document.querySelectorAll('.brand, header, #storageWarning, main, nav').forEach(element=>{ element.inert=inert; });
}
function openModal(initialFocusSelector,opener){
  const active=opener||document.activeElement;
  modalReturnFocus=active&&active!==document.body?{element:active,focusId:active.dataset.focusId||'',id:active.id||''}:null;
  const modal=document.getElementById('modal'), sheet=document.getElementById('sheet');
  modal.classList.add('open'); setModalBackgroundInert(true);
  requestAnimationFrame(()=>{ (initialFocusSelector&&sheet.querySelector(initialFocusSelector)||sheet.querySelector('button, input, select, textarea, [tabindex]:not([tabindex="-1"])')||sheet).focus(); });
}
function closeModal(restore=true){
  const modal=document.getElementById('modal'); if(!modal.classList.contains('open')) return;
  const returnTarget=modalReturnFocus; modalReturnFocus=null; modal.classList.remove('open'); setModalBackgroundInert(false);
  if(restore!==false&&returnTarget) requestAnimationFrame(()=>{
    const target=returnTarget.focusId&&document.querySelector(`[data-focus-id="${returnTarget.focusId}"]`)||returnTarget.id&&document.getElementById(returnTarget.id)||returnTarget.element;
    if(target?.isConnected) target.focus();
  });
}
const navEl=document.querySelector('nav');
const toastEl=document.getElementById('toast');
let floatingUiFrame=0;
function syncFloatingUi(){
  floatingUiFrame=0;
  const viewport=window.visualViewport, viewportTop=viewport?.offsetTop||0, viewportHeight=viewport?.height||window.innerHeight;
  const navHeight=Math.ceil(navEl.getBoundingClientRect().height), navTop=Math.max(0,viewportTop+viewportHeight-navHeight);
  document.documentElement.style.setProperty('--nav-h',`${navHeight}px`);
  navEl.style.setProperty('--nav-y',`${Math.round(navTop)}px`);
  const toastHeight=Math.ceil(toastEl.getBoundingClientRect().height), toastTop=Math.max(viewportTop+8,navTop-10-toastHeight);
  toastEl.style.setProperty('--toast-y',`${Math.round(toastTop)}px`);
}
function scheduleFloatingUi(){ if(!floatingUiFrame) floatingUiFrame=requestAnimationFrame(syncFloatingUi); }
navEl.classList.add('visual-viewport-anchor'); toastEl.classList.add('visual-viewport-anchor');
if('ResizeObserver' in window){ const floatingObserver=new ResizeObserver(scheduleFloatingUi); floatingObserver.observe(navEl); floatingObserver.observe(toastEl); }
window.addEventListener('resize',scheduleFloatingUi);
window.addEventListener('orientationchange',scheduleFloatingUi);
if(window.visualViewport){
  visualViewport.addEventListener('resize',scheduleFloatingUi);
  visualViewport.addEventListener('scroll',scheduleFloatingUi,{passive:true});
  if('onscrollend' in visualViewport) visualViewport.addEventListener('scrollend',scheduleFloatingUi);
}
scheduleFloatingUi();
document.getElementById('modal').addEventListener('click', e=>{ if(e.target.id==='modal') closeModal(); });
document.addEventListener('keydown',e=>{
  const modal=document.getElementById('modal'); if(!modal.classList.contains('open')) return;
  if(e.key==='Escape'){ e.preventDefault(); closeModal(); return; }
  if(e.key!=='Tab') return;
  const focusable=[...document.getElementById('sheet').querySelectorAll('button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), a[href], [tabindex]:not([tabindex="-1"])')].filter(element=>!element.hidden);
  if(!focusable.length){ e.preventDefault(); document.getElementById('sheet').focus(); return; }
  const first=focusable[0], last=focusable[focusable.length-1];
  if(e.shiftKey&&document.activeElement===first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey&&document.activeElement===last){ e.preventDefault(); first.focus(); }
});
history.replaceState({promosView:PROMOS_VIEW,radarFilter:RADAR_FILTER},'',location.pathname+location.search);
window.addEventListener('popstate',e=>{
  const normalized=normalizePromosHistory(e.state); PROMOS_VIEW=normalized.view; RADAR_FILTER=normalized.filter; beginRadarVisit(new Date());
  TAB='promos'; render(); window.scrollTo({top:0,behavior:'auto'}); requestAnimationFrame(()=>document.getElementById('hdr').focus());
});
function refreshIfCalendarChanged(){
  const now=new Date(), currentDayKey=localIsoDate(localDay(now)), currentMonthKey=periodInfo('month',now).key, previousMonthKey=renderedMonthKey;
  if(currentDayKey===renderedDayKey) return;
  if(TAB==='promos') beginRadarVisit(now);
  const focusTarget=captureRefreshFocus(now); render(); restoreRefreshFocus(focusTarget);
  if(currentMonthKey!==previousMonthKey) toast('A new tracking period started. Review the refreshed items.',5000);
}

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{

  if(TAB==='promos') beginRadarVisit(new Date());
  render(); window.scrollTo({top:0,behavior:'auto'});
});
document.getElementById('storageBackup').onclick=()=>copySetupLink();
if(TAB==='promos') beginRadarVisit(new Date());
render();
if(startupNotice) setTimeout(()=>toast(startupNotice,3600),0);
