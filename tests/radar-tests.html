<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>Benefit Radar tests</title>
<style>
  body{font:15px/1.5 system-ui,sans-serif;max-width:760px;margin:32px auto;padding:0 18px;color:#172033;background:#f7f8fb}
  h1{font-size:24px}.pass{color:#08704f}.fail{color:#b42318}li{margin:5px 0}
  iframe{position:absolute;width:1px;height:1px;border:0;opacity:0;pointer-events:none}
</style>
</head>
<body>
<h1>Benefit Radar tests</h1>
<p id="summary">Running…</p>
<ol id="results"></ol>
<iframe id="app" src="../index.html"></iframe>
<script>
'use strict';
const tests=[];
function test(name,fn){tests.push({name,fn});}
function assert(value,message){if(!value)throw new Error(message||'Assertion failed');}
function equal(actual,expected,message){if(actual!==expected)throw new Error(message||`Expected ${expected}, received ${actual}`);}

document.getElementById('app').addEventListener('load',async()=>{
  const app=document.getElementById('app').contentWindow, R=app.CardRouterRadar;
  let frameCounter=0;
  const afterRender=win=>new Promise(resolve=>win.requestAnimationFrame(()=>win.requestAnimationFrame(resolve)));
  async function withAppState(state,fn){
    const previous=app.localStorage.getItem('cardrouter'), frame=document.createElement('iframe');
    app.localStorage.setItem('cardrouter',JSON.stringify(state));
    frame.src=`../index.html?domtest=${++frameCounter}`; document.body.appendChild(frame);
    await new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));
    try{return await fn(frame.contentWindow,frame.contentDocument,frame);}
    finally{
      frame.remove();
      if(previous===null) app.localStorage.removeItem('cardrouter'); else app.localStorage.setItem('cardrouter',previous);
    }
  }
  test('calendar periods use local month, quarter, and half-year keys',()=>{
    equal(R.periodInfo('month',new Date(2026,7,26)).key,'2026-08');
    equal(R.periodInfo('quarter',new Date(2026,7,26)).key,'2026-Q3');
    equal(R.periodInfo('half',new Date(2026,7,26)).key,'2026-H2');
  });
  test('period ends are exclusive local boundaries',()=>{
    equal(R.periodEndFromKey('2026-08').getDate(),1);
    equal(R.periodEndFromKey('2026-08').getMonth(),8);
    equal(R.periodEndFromKey('2026-Q4').getFullYear(),2027);
  });
  test('calendar-day math is stable across daylight-saving boundaries',()=>{
    equal(R.calendarDays(new Date(2026,2,7),new Date(2026,2,10)),3);
  });
  test('24-calendar-month subtraction clamps leap-day dates',()=>{
    const d=R.minusCalendarMonths(new Date(2028,1,29),24);
    equal(d.getFullYear(),2026); equal(d.getMonth(),1); equal(d.getDate(),28);
  });
  test('annual cadence uses a true calendar year and rejects unknown cadence',()=>{
    const p=R.periodInfo('year',new Date(2026,7,26));
    equal(p.key,'2026-Y'); equal(p.end.getFullYear(),2027); equal(p.end.getMonth(),0);
    let threw=false; try{R.periodInfo('weekly',new Date(2026,7,26));}catch(error){threw=true;}
    assert(threw,'Unknown cadence must throw');
  });
  test('legacy truthy activation records migrate once to canonical completion keys',()=>{
    const now=new Date(2026,7,26,12), raw={myCards:['freedom_flex'],activations:{'2026-Q3:freedom_flex':true,'2026-Q3:discover_it':false}};
    const once=R.normalizeState(raw,now), twice=R.normalizeState(once,now);
    equal(Object.keys(once.completions)[0],'activate:freedom_flex:freedom_flex_5x:2026-Q3');
    equal(Object.keys(twice.completions).length,1);
    equal(once.completions[Object.keys(once.completions)[0]].completedAt,null);
  });
  test('Radar prioritizes non-retroactive work, then deadlines across task types',()=>{
    const now=new Date(2026,7,26,12), state=R.normalizeState({myCards:['amex_gold','discover_it','freedom_flex']},now), radar=R.buildRadarTasks(state,now);
    const diningIndex=radar.all.findIndex(t=>t.itemId==='dining_credit'), freedomIndex=radar.all.findIndex(t=>t.itemId==='freedom_flex_5x');
    equal(radar.all.length,6); equal(radar.all[0].itemId,'discover_5pct');
    assert(diningIndex>0&&diningIndex<freedomIndex,'An August benefit should precede a non-retroactive false September action');
    equal(radar.all[0].group,'act'); equal(radar.all[freedomIndex].group,'soon');
  });
  test('quarterly skips suppress Radar without removing quarterly inventory',()=>{
    const now=new Date(2026,7,26,12), period='2026-Q3', key='activate:freedom_flex:freedom_flex_5x:'+period;
    const state=R.normalizeState({myCards:['freedom_flex'],radarSkips:{[key]:{
      taskKind:'activate',cardId:'freedom_flex',itemId:'freedom_flex_5x',periodKey:period,
      skippedAt:'2026-08-26T12:00:00.000Z',expiresAt:'2026-10-01T00:00:00.000Z'
    }}},now), radar=R.buildRadarTasks(state,now);
    equal(radar.all.length,1); equal(radar.active.length,0); equal(radar.suppressed.length,1);
  });
  test('verified action deadlines close independently of the quarter period',()=>{
    const state={myCards:['freedom_flex']}, before=R.buildRadarTasks(state,new Date(2026,8,10,12)).all[0];
    equal(before.daysLeft,4); assert(!before.closed,'Action should still be open September 10');
    const closed=R.buildRadarTasks(state,new Date(2026,8,15,12));
    assert(closed.all[0].closed,'Action should close September 15'); equal(closed.active.length,0);
  });
  test('deadline policies continue into later quarters',()=>{
    const freedom=R.buildRadarTasks({myCards:['freedom_flex']},new Date(2026,9,2,12)).all[0];
    const cash=R.buildRadarTasks({myCards:['usb_cashplus']},new Date(2026,9,2,12)).all[0];
    equal(freedom.actionEnd.getMonth(),11); equal(freedom.actionEnd.getDate(),15);
    equal(cash.actionEnd.getMonth(),11); equal(cash.actionEnd.getDate(),27);
  });
  test('closed unrecorded activation windows fall back to the base card rate',()=>{
    const before=R.rankForState({myCards:['freedom_flex']},'gas',new Date(2026,8,14,12))[0];
    const closed=R.rankForState({myCards:['freedom_flex']},'gas',new Date(2026,8,15,12))[0];
    const completed=R.rankForState({myCards:['freedom_flex'],completions:[{
      actionType:'activate',cardId:'freedom_flex',itemId:'freedom_flex_5x',periodKey:'2026-Q3',completedAt:'2026-09-14T12:00:00.000Z'
    }]},'gas',new Date(2026,8,15,12))[0];
    equal(before.eff,5); assert(before.needsActivation,'Activation should still be actionable September 14');
    equal(closed.eff,1); assert(closed.activationClosed,'Closed activation should use the base rate');
    equal(completed.eff,5); assert(completed.viaRotating,'Recorded activation should retain the rotating rate');
  });
  test('every Radar action uses its audited, benefit-specific destination',()=>{
    const now=new Date(2026,7,26,12), cards=['freedom_flex','discover_it','usb_cashplus','amex_plat','csr','csp','amex_gold','biz_plat','biz_gold','bcp'];
    const radar=R.buildRadarTasks({myCards:cards},now), expected={
      'freedom_flex:freedom_flex_5x':'https://www.chase.com/personal/credit-cards/freedom/freedomfive',
      'discover_it:discover_5pct':'https://www.discover.com/credit-cards/cash-back/cashback-calendar.html',
      'usb_cashplus:usb_cashplus_categories':'https://cashplus.usbank.com/?redirect=cashplus',
      'amex_plat:fhr_hotel_credit':'https://global.americanexpress.com/card-benefits/detail/hotel-credit/platinum',
      'amex_plat:resy_dining_credit':'https://global.americanexpress.com/card-benefits/detail/400-resy-credit/platinum',
      'amex_plat:uber_cash':'https://global.americanexpress.com/card-benefits/detail/uber-rides-with-platinum/platinum',
      'amex_plat:digital_entertainment_credit':'https://global.americanexpress.com/card-benefits/detail/digital-entertainment/platinum',
      'amex_plat:lululemon_credit':'https://global.americanexpress.com/card-benefits/detail/lululemon-credit/platinum',
      'csr:exclusive_tables_credit':'https://www.chase.com/personal/credit-cards/education/basics/how-to-use-dining-credit-chase-sapphire-reserve-exclusive-tables',
      'csr:stubhub_viagogo_credit':'https://www.chase.com/personal/credit-cards/education/rewards-benefits/how-to-use-the-%24300-stubhub-credit-with-chase-sapphire-reserve',
      'csr:peloton_credit':'https://www.onepeloton.com/chase-sapphire-reserve',
      'csp:doordash_promo_credit':'https://www.doordash.com/en/dashpass/partner/chase/preferred',
      'amex_gold:dining_credit':'https://global.americanexpress.com/card-benefits/detail/dining-credit/gold',
      'amex_gold:resy_credit':'https://global.americanexpress.com/card-benefits/detail/resy-credit/gold',
      'amex_gold:dunkin_credit':'https://global.americanexpress.com/card-benefits/detail/dunkin-credit/gold',
      'amex_gold:uber_cash':'https://global.americanexpress.com/card-benefits/detail/uber-cash/gold',
      'biz_plat:fhr_hotel_credit':'https://global.americanexpress.com/card-benefits/detail/hotel-credit/business-platinum',
      'biz_plat:indeed_credit':'https://global.americanexpress.com/card-benefits/detail/indeed-benefit/business-platinum',
      'biz_plat:wireless_service_credit':'https://global.americanexpress.com/card-benefits/detail/wireless-credit/business-platinum',
      'biz_gold:flexible_business_credit':'https://global.americanexpress.com/card-benefits/detail/240-flexible-business-credit/business-gold',
      'bcp:disney_bundle_credit':'https://global.americanexpress.com/card-benefits/detail/disney-streaming-credit/blue-cash-preferred'
    };
    equal(radar.all.length,Object.keys(expected).length,'Every verified action should be included in the audited link inventory');
    radar.all.forEach(task=>equal(task.link,expected[task.card.id+':'+task.itemId],`Unexpected destination for ${task.card.id}:${task.itemId}`));
    const uber=radar.all.find(t=>t.card.id==='amex_gold'&&t.itemId==='uber_cash');
    equal(uber.markLabel,'Mark card added'); equal(uber.prerequisiteLabel,'Add card to Uber');
  });
  test('time-bounded Business Gold copy changes after FedEx eligibility ends',()=>{
    const before=R.buildRadarTasks({myCards:['biz_gold']},new Date(2026,8,30,12)).all.find(t=>t.itemId==='flexible_business_credit');
    const after=R.buildRadarTasks({myCards:['biz_gold']},new Date(2026,9,2,12)).all.find(t=>t.itemId==='flexible_business_credit');
    assert(before.detail.startsWith('FedEx through Oct 1, 2026;'),'Only FedEx should carry the October cutoff');
    assert(!after.detail.includes('FedEx'),'FedEx should disappear beginning October 2');
  });
  test('enrollment changes one recurring row into its usage phase',()=>{
    const now=new Date(2026,7,26,12), state=R.normalizeState({myCards:['amex_gold'],enrollments:[{
      cardId:'amex_gold',benefitId:'dining_credit',enrolledAt:'2026-08-20T12:00:00.000Z'
    }]},now), radar=R.buildRadarTasks(state,now), dining=radar.all.find(t=>t.itemId==='dining_credit');
    equal(dining.kind,'use'); equal(dining.markLabel,'Mark used');
  });
  test('normalization rebuilds canonical completion keys and prunes old history',()=>{
    const now=new Date(2026,7,26,12), state=R.normalizeState({myCards:['discover_it'],completions:{wrong:{
      actionType:'activate',cardId:'discover_it',itemId:'discover_5pct',periodKey:'2026-Q3',completedAt:'2026-08-01T12:00:00.000Z'
    },old:{actionType:'activate',cardId:'discover_it',itemId:'discover_5pct',periodKey:'2023-Q1',completedAt:'2023-01-01T12:00:00.000Z'}}},now);
    equal(Object.keys(state.completions).length,1);
    equal(Object.keys(state.completions)[0],'activate:discover_it:discover_5pct:2026-Q3');
  });
  test('normalization rejects impossible periods, arbitrary undated records, and far-future events',()=>{
    const now=new Date(2026,7,26,12), state=R.normalizeState({myCards:['amex_gold'],completions:{bad:{
      actionType:'use',cardId:'amex_gold',itemId:'dining_credit',periodKey:'2026-99',completedAt:null
    }},enrollments:[{cardId:'amex_gold',benefitId:'dining_credit',enrolledAt:'9999-12-31T00:00:00.000Z'}]},now);
    equal(Object.keys(state.completions).length,0); equal(Object.keys(state.enrollments).length,0);
  });
  test('known undated activations from the preceding schema are upgraded compatibly',()=>{
    const now=new Date(2026,7,26,12), base={actionType:'activate',cardId:'discover_it',itemId:'discover_5pct',periodKey:'2026-Q3',completedAt:null};
    const normalized=R.normalizeState({completions:[base]},now), record=Object.values(normalized.completions)[0];
    equal(Object.keys(normalized.completions).length,1); assert(record.legacyUndated,'Undated known activation should receive the migration marker');
  });
  test('setup imports cannot preload future-period completion or skip state',()=>{
    const now=new Date(2026,7,26,12), future={actionType:'activate',cardId:'freedom_flex',itemId:'freedom_flex_5x',periodKey:'2027-Q3',completedAt:'2026-08-26T12:00:00.000Z'};
    const skip={taskKind:'activate',cardId:'freedom_flex',itemId:'freedom_flex_5x',periodKey:'2027-Q3',skippedAt:'2026-08-26T12:00:00.000Z',expiresAt:'2027-10-01T00:00:00.000Z'};
    const imported=R.normalizeState({completions:[future],radarSkips:[skip]},now,{fromImport:true});
    equal(Object.keys(imported.completions).length,0); equal(Object.keys(imported.radarSkips).length,0);
  });
  test('setup schema versions must be supported integers',()=>{
    let threw=false; try{R.validateImportPayload({schemaVersion:'banana'},20,20);}catch(error){threw=true;}
    assert(threw,'Invalid schema version should be rejected');
    R.validateImportPayload({schemaVersion:2,myCards:[]},20,20);
    R.validateImportPayload({myCards:['freedom_flex'],overrides:{freedom_flex:{gas:{v:4,u:'%'}}},cpp:{chase:1.5},custom:[],activations:{'2026-Q3:freedom_flex':true}},200,200);
  });
  test('setup validation rejects unknown root and record fields',()=>{
    for(const raw of [{schemaVersion:2,surprise:true},{schemaVersion:2,completions:[{actionType:'use',mystery:true}]},{schemaVersion:2,myCards:'not a card list'}]){
      let threw=false; try{R.validateImportPayload(raw,100,100);}catch(error){threw=true;}
      assert(threw,'Unknown setup fields should be rejected atomically');
    }
  });
  test('setup validation rejects malformed records and typed values atomically',()=>{
    const malformed=[
      {schemaVersion:2,completions:[null]},
      {schemaVersion:2,completions:[{actionType:'use',cardId:'amex_gold'}]},
      {schemaVersion:2,activations:{'2026-Q3:freedom_flex':'yes'}},
      {schemaVersion:2,custom:[{id:'cust_test',name:'Test',program:'cash',rates:{other:{v:'1',u:'%'}}}]}
    ];
    for(const raw of malformed){
      let threw=false; try{R.validateImportPayload(raw,200,200);}catch(error){threw=true;}
      assert(threw,'Malformed setup data should reject the whole import');
    }
  });
  test('legacy long custom-card IDs migrate without losing lineup or overrides',()=>{
    const legacyId='cust_'+('long_card_name_'.repeat(6)), raw={myCards:[legacyId],custom:[{
      id:legacyId,name:'A deliberately long legacy custom card name that still belongs to the user',issuer:'Custom',program:'cash',rates:{other:{v:2,u:'%'}},notes:''
    }],overrides:{[legacyId]:{gas:{v:3,u:'%'}}}};
    const validated=R.validateImportPayload(raw,800,600), state=R.normalizeState(raw,new Date());
    assert(validated.custom[0].id.length<=64,'Imported legacy ID should be remapped before validation');
    equal(state.custom.length,1); equal(state.myCards[0],state.custom[0].id); assert(state.overrides[state.custom[0].id],'Legacy override should follow the remapped card ID');
  });
  test('setup validation rejects unknown identities and false attestations atomically',()=>{
    const now=new Date(), completedAt=now.toISOString(), currentMonth=R.periodInfo('month',now).key, currentQuarter=R.periodInfo('quarter',now).key, invalid=[
      {schemaVersion:2,myCards:['not_a_real_card']},
      {schemaVersion:2,completions:[{actionType:'use',cardId:'amex_gold',itemId:'not_a_benefit',periodKey:'2026-08',completedAt}]},
      {schemaVersion:2,completions:[{actionType:'activate',cardId:'freedom_flex',itemId:'freedom_flex_5x',periodKey:'2026-Q3',completedAt,attestedBy:'2026-09-13'}]},
      {schemaVersion:2,enrollments:[{cardId:'amex_gold',benefitId:'dining_credit',enrolledAt:'9999-12-31T00:00:00.000Z'}]},
      {schemaVersion:2,completions:[{actionType:'use',cardId:'amex_gold',itemId:'dining_credit',periodKey:currentMonth,completedAt:'9999-12-31T00:00:00.000Z'}]},
      {schemaVersion:2,radarSkips:[{taskKind:'activate',cardId:'freedom_flex',itemId:'freedom_flex_5x',periodKey:currentQuarter,skippedAt:completedAt,expiresAt:'9999-12-31T00:00:00.000Z'}]}
    ];
    for(const raw of invalid){
      let threw=false; try{R.validateImportPayload(raw,300,300,now);}catch(error){threw=true;}
      assert(threw,'Unsupported setup identity should reject the whole import');
    }
  });
  test('older valid setup links keep working after Radar records age out',()=>{
    const now=new Date(2026,7,26,12), raw={schemaVersion:2,myCards:['freedom_flex'],completions:[{
      actionType:'activate',cardId:'freedom_flex',itemId:'freedom_flex_5x',periodKey:'2023-Q3',completedAt:'2023-08-01T12:00:00.000Z'
    }],radarSkips:[{
      taskKind:'activate',cardId:'freedom_flex',itemId:'freedom_flex_5x',periodKey:'2023-Q3',skippedAt:'2023-08-01T12:00:00.000Z',expiresAt:'2023-10-01T00:00:00.000Z'
    }]};
    const validated=R.validateImportPayload(raw,500,400,now), state=R.normalizeState(validated,now,{fromImport:true});
    equal(state.myCards[0],'freedom_flex'); equal(Object.keys(state.completions).length,0); equal(Object.keys(state.radarSkips).length,0);
  });
  test('late quarterly completion records an attested deadline separately',()=>{
    const now=new Date(2026,8,16,12), task=R.buildRadarTasks({myCards:['freedom_flex']},now).all[0];
    const record=R.completionRecordForTask(task,now), completed=R.buildRadarTasks({myCards:['freedom_flex'],completions:[record]},now).all[0];
    equal(record.attestedBy,'2026-09-14'); equal(record.completedAt,now.toISOString()); equal(completed.attestedBy,'2026-09-14');
  });
  test('compact setup encoding round-trips Unicode data',()=>{
    const raw={schemaVersion:2,custom:[{name:'Café 東京'}]}, encoded=R.encodeSetupPayload(raw), decoded=JSON.parse(R.decodeSetupPayload(encoded));
    assert(encoded.startsWith('v2.'),'Expected versioned base64url encoding'); equal(decoded.custom[0].name,'Café 東京');
  });
  test('setup validation rejects oversized payload metadata',()=>{
    let threw=false; try{R.validateImportPayload({schemaVersion:2},40000,10);}catch(error){threw=true;}
    assert(threw,'Oversized setup should be rejected before import');
    threw=false; try{R.encodeSetupState({schemaVersion:2,custom:[{name:'x'.repeat(40000)}]});}catch(error){threw=true;}
    assert(threw,'Oversized setup should be rejected before creating an outbound link');
  });
  test('calendar download contains four consistent private recurring events',()=>{
    const ics=R.buildICS(new Date(2026,7,26,12));
    equal((ics.match(/BEGIN:VEVENT/g)||[]).length,4);
    equal((ics.match(/BEGIN:VALARM/g)||[]).length,4);
    assert(ics.includes('\r\n'),'Expected CRLF line endings');
    assert(!/Freedom|Discover|Cash\+|Amex/i.test(ics),'Calendar must not reveal held-card data');
  });
  test('Radar subview survives a real page reload',async()=>{
    await withAppState({schemaVersion:2,myCards:['amex_gold']},async(win,doc,frame)=>{
      doc.querySelector('nav button[data-tab="promos"]').click(); doc.getElementById('radar-view-all').click();
      equal(doc.title,'ChooseMyCard · Benefit Radar');
      const loaded=new Promise(resolve=>frame.addEventListener('load',resolve,{once:true})); win.location.reload(); await loaded;
      equal(frame.contentDocument.title,'ChooseMyCard · Benefit Radar');
    });
  });
  test('Benefit Radar consolidates quarterly categories without a second destination',async()=>{
    const hiddenAt=new Date().toISOString();
    await withAppState({schemaVersion:2,myCards:['amex_plat','discover_it'],radarHidden:[{cardId:'amex_plat',benefitId:'uber_cash',hiddenAt}]},async(win,doc)=>{
      doc.querySelector('nav button[data-tab="promos"]').click();
      const radarIcon=doc.querySelector('.section-head .title-icon'), quarterlyIcon=doc.querySelector('.quarterly-nav .title-icon');
      equal(radarIcon.textContent,'📡'); equal(quarterlyIcon.textContent,'📅');
      assert(radarIcon.getAttribute('aria-hidden')==='true'&&quarterlyIcon.getAttribute('aria-hidden')==='true','Overview icons should be decorative');
      assert(!doc.body.textContent.includes('Quarterly actions'),'The retired duplicate destination should not render');
      assert(doc.getElementById('quarterly-view-all').textContent.includes('View in Benefit Radar'),'Quarterly row should explain its single-inbox destination');
      doc.getElementById('radar-view-all').click();
      equal(doc.title,'ChooseMyCard · Benefit Radar'); equal(doc.getElementById('hdrsub').textContent,'what needs attention');
      equal(doc.querySelector('#hdr .title-icon').textContent,'📡'); equal(doc.querySelector('#hdr .title-icon').getAttribute('aria-hidden'),'true');
      assert(doc.getElementById('not-shown-toggle').textContent.includes('Hidden (1)'),'Hidden disclosure should use the approved label');
      assert(!doc.getElementById('not-shown-toggle').textContent.includes('Not shown'),'Legacy Hidden copy should not return');
      doc.querySelector('nav button[data-tab="promos"]').click(); doc.getElementById('quarterly-view-all').click();
      equal(doc.title,'ChooseMyCard · Benefit Radar'); equal(doc.querySelector('#hdr .title-icon').textContent,'📡');
      equal(doc.getElementById('quarterly-filter').getAttribute('aria-pressed'),'true'); equal(doc.getElementById('quarterly-filter').textContent,'Show all');
      assert(doc.body.textContent.includes('Status is stored only on this device.'),'Manual tracking should be explained in-product');
    });
  });
  test('external action links stay at the top right of action cards',async()=>{
    await withAppState({schemaVersion:2,myCards:['usb_cashplus','amex_plat']},async(win,doc,frame)=>{
      doc.querySelector('nav button[data-tab="promos"]').click();
      const promoRow=doc.querySelector('.action-row');
      assert(promoRow.querySelector('.action-topline > .issuer-action'),'Promos link should be in the card topline');
      assert(promoRow.querySelector('.action-footer > .task-check'),'Promos checkbox should remain in the footer');
      assert(!promoRow.querySelector('.action-links .issuer-action'),'External link should not return to the secondary-actions area');
      frame.style.width='320px'; await afterRender(win);
      const promoLink=promoRow.querySelector('.issuer-action'), promoLinkRect=promoLink.getBoundingClientRect(), promoRowRect=promoRow.getBoundingClientRect();
      assert(promoLinkRect.height>=44,'Promos external link should keep a 44px touch target at phone width');
      assert(promoLinkRect.right<=promoRowRect.right,'Promos external link should remain inside the card at phone width');
      assert(doc.documentElement.scrollWidth<=win.innerWidth,'Phone layout should not overflow horizontally');
      doc.getElementById('radar-view-all').click();
      const skip=doc.querySelector('[data-skip-task]'), skippedKey=skip.dataset.skipTask;
      skip.click(); await afterRender(win);
      assert(JSON.parse(win.localStorage.getItem('cardrouter')).radarSkips[skippedKey],'Skip should persist after the footer restructuring');
      const hide=doc.querySelector('[data-hide-task]');
      assert(hide,'Expected another benefit action that can be hidden'); hide.click(); await afterRender(win);
